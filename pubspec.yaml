
name: eliezers
description: A new Flutter project.
publish_to: "none"

version: 1.2.4+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Local storage and caching
  cached_network_image: ^3.3.0
  shared_preferences: ^2.0.15
  path_provider: ^2.1.5

  # Environment
  flutter_dotenv: ^5.0.2

  # Firebase
  firebase_auth: ^5.4.2
  firebase_core: ^3.11.0
  firebase_messaging: ^15.2.2

  # HTTP and API clients
  http: ^1.5.0
  dio: ^5.4.0
  retrofit: ^4.1.0

  # Serialization annotations
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.1

  # Utilities
  share_plus: ^10.1.4
  flutter_local_notifications: ^18.0.1
  connectivity_plus: ^6.0.1
  flutter_image_compress: ^2.1.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  reorderables: ^0.6.0
  permission_handler: ^12.0.1
  device_info_plus: ^11.3.0
  image_cropper: ^9.0.0
  image_gallery_saver_plus: ^4.0.0
  timezone: ^0.10.1
  intl: ^0.20.2
  async: ^2.11.0
  hashids2: ^2.0.0

  # Google services and maps
  google_sign_in: ^6.1.5
  google_maps_flutter: ^2.18.1
  geolocator: 14.0.2
  geocoding: ^5.0.0
  flutter_google_places_sdk: ^0.4.0

  # Dependency injection
  get_it: ^8.0.3
  injectable: ^2.4.1

  # Routing
  auto_route: ^9.3.0+1

  # State management
  bloc: ^9.0.0
  flutter_bloc: ^9.0.0
  get: ^4.6.5

  # UI and design
  moon_design: ^1.1.0
  pinput: ^4.0.0
  flutter_svg: ^2.0.9
  flutter_animate: ^4.5.0
  gap: ^3.0.1
  cupertino_icons: ^1.0.2
  photo_view: ^0.15.0
  lottie: ^3.0.0
  flutter_native_splash: ^2.4.4
  map_launcher: ^3.1.0


  # Logging
  logging: ^1.2.0
  logger: ^2.3.0
  flutter_logs: ^2.1.12

  # Deep links and notifications
  app_links: ^6.4.0
  pull_to_refresh: ^2.0.0
  audioplayers: ^6.5.1
  file_picker: ^11.0.3
  flutter_chord: ^0.1.3
  tonic: ^0.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code generation
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  retrofit_generator: ^9.1.5
  injectable_generator: ^2.6.1
  auto_route_generator: ^9.0.0

  # Asset and localization generation
  flutter_gen_runner: ^5.4.0
  slang: ^4.4.1
  slang_flutter: ^4.4.0
  slang_build_runner: ^4.4.2
  just_waveform: ^0.0.7

flutter_gen:
  output: lib/gen/
  line_length: 80
  integrations:
    flutter_svg: true
    lottie: true

flutter:
  uses-material-design: true

  fonts:
    - family: SFPro
      fonts:
        - asset: assets/fonts/sfpro/SF-Pro-Display-Regular.otf
          weight: 400
        - asset: assets/fonts/sfpro/SF-Pro-Display-Medium.otf
          weight: 500
        - asset: assets/fonts/sfpro/SF-Pro-Display-Semibold.otf
          weight: 700

    - family: Kh_Bl_LazySmooth_Regular
      fonts:
        - asset: assets/fonts/Kh_Bl_LazySmooth_Regular.ttf

  assets:
    - assets/image/
    - assets/svg/
    - assets/svg/tabs/
    - assets/animations/

flutter_native_splash:
  color: "#444444"
  color_dark: "#444444"
  image: assets/image/logo.png
  android: true
  ios: true
  android_gravity: center
  ios_content_mode: center
  fullscreen: true
targets:
  $default:
    builders:
      retrofit_generator:
        generate_for:
          - lib/data/remote/**.dart